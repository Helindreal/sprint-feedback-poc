<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Feedback - Dashboard Interactif</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fixed-table { table-layout: fixed; }
        .voted-btn { background-color: #10b981 !important; color: white !important; cursor: default; }
        .toast-slide { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn {
            from { transform: translateY(-100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-900 font-sans flex justify-center">
    <div class="w-full max-w-4xl">
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Bannière de succès -->
            <div id="vote-success-banner" class="hidden toast-slide bg-green-600 text-white p-4 text-center shadow-lg">
                <div class="flex items-center justify-center gap-3">
                    <span class="text-xl">✓</span>
                    <span class="font-bold uppercase tracking-widest text-xs">
                        Int&eacute;r&ecirc;t enregistr&eacute; pour <span id="voted-ticket-name" class="underline"></span> !
                    </span>
                </div>
            </div>

            <header class="p-10 pb-6 text-center bg-white">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight mb-2">
                    Sprint <span class="text-blue-600">Feedback</span>
                </h1>
                <div class="space-y-1">
                    <p id="current-sprint-display" class="text-slate-500 font-bold italic">Chargement du dashboard...</p>
                </div>
            </header>

            <main class="p-8 pt-0">
                <div class="w-full h-px bg-slate-200 mb-8"></div>

                <div id="view-dashboard" class="hidden space-y-6">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-3">
                            <span class="text-xl">📊</span>
                            Sujets les plus attendus
                        </h2>
                        
                        <div id="sprint-selector-container" class="hidden">
                            <select id="sprint-select" class="bg-slate-50 border border-slate-200 text-[11px] font-bold rounded-lg px-3 py-1.5 text-slate-600 focus:outline-none">
                            </select>
                        </div>
                    </div>

                    <div id="table-wrapper" class="hidden rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse fixed-table">
                            <thead class="bg-slate-100 border-b border-slate-200">
                                <tr>
                                    <th class="w-[20%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">Ticket</th>
                                    <th class="w-[60%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">R&eacute;sum&eacute;</th>
                                    <th class="w-[20%] px-6 py-4 text-center text-[10px] font-black text-slate-500 uppercase tracking-widest">Action</th>
                                </tr>
                            </thead>
                            <tbody id="votes-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                            </tbody>
                        </table>
                    </div>

                    <div id="no-votes" class="hidden py-16 text-center">
                        <p class="text-slate-400 font-medium italic">Aucun vote pour le moment.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMJd9PI6mwwGvCmTAtqE53q7ZrHgt2VE",
            authDomain: "sprint-feedback.firebaseapp.com",
            projectId: "sprint-feedback",
            storageBucket: "sprint-feedback.firebasestorage.app",
            messagingSenderId: "637255677602",
            appId: "1:637255677602:web:b19f5c84f2226f9a8009fb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const ticketIdFromUrl = params.get('ticket');
        const summaryFromUrl = params.get('summary');
        const urlSprint = params.get('sprint');
        
        let currentSprint = urlSprint ? urlSprint.trim() : null;
        let allData = [];
        let autoVoted = false;

        // --- GESTION DU STOCKAGE LOCAL PAR SPRINT ---
        const getVotedTickets = () => JSON.parse(localStorage.getItem('sprint_votes_v2') || '{}');
        
        const markAsVoted = (tid, sprint) => {
            const voted = getVotedTickets();
            const key = `${tid}||${sprint}`;
            voted[key] = true;
            localStorage.setItem('sprint_votes_v2', JSON.stringify(voted));
        };

        const hasVoted = (tid, sprint) => {
            const voted = getVotedTickets();
            const key = `${tid}||${sprint}`;
            return !!voted[key];
        };

        window.castVote = async (tid, summ) => {
            const sprintName = currentSprint || "Sprint Inconnu";
            
            if (hasVoted(tid, sprintName)) return;

            const voteRef = doc(db, "votes", tid);
            
            try {
                const snap = await getDoc(voteRef);
                if (snap.exists()) {
                    await updateDoc(voteRef, { 
                        count: increment(1), 
                        lastUpdated: new Date().toISOString() 
                    });
                } else {
                    await setDoc(voteRef, { 
                        ticket: tid, 
                        summary: summ || "N/A", 
                        sprint: sprintName, 
                        count: 1, 
                        lastUpdated: new Date().toISOString() 
                    });
                }
                markAsVoted(tid, sprintName);
                showSuccess(tid);
                refreshTable(); 
            } catch (e) { console.error("Firestore Error:", e); }
        };

        function showSuccess(tid) {
            const banner = document.getElementById('vote-success-banner');
            document.getElementById('voted-ticket-name').innerText = tid;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 4000);
        }

        async function start() {
            await signInAnonymously(auth);
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    // Logique d'auto-vote via URL
                    if (ticketIdFromUrl && !autoVoted) {
                        const sprintForUrl = urlSprint || "Sprint Inconnu";
                        if (!hasVoted(ticketIdFromUrl, sprintForUrl)) {
                            autoVoted = true;
                            await castVote(ticketIdFromUrl, summaryFromUrl);
                        } else {
                            // Déjà voté mais on affiche quand même un petit rappel
                            showSuccess(ticketIdFromUrl);
                        }
                    }
                    handleDashboard();
                }
            });
        }

        function handleDashboard() {
            document.getElementById('view-dashboard').classList.remove('hidden');
            const select = document.getElementById('sprint-select');
            const selectorContainer = document.getElementById('sprint-selector-container');
            const sprintDisplay = document.getElementById('current-sprint-display');

            onSnapshot(collection(db, "votes"), (snap) => {
                allData = [];
                const foundSprints = new Set();
                snap.forEach(d => {
                    const data = d.data();
                    allData.push(data);
                    if (data.sprint) foundSprints.add(data.sprint);
                });

                const sortedSprints = Array.from(foundSprints).sort().reverse();
                if (!currentSprint && sortedSprints.length > 0) currentSprint = sortedSprints[0];
                sprintDisplay.innerText = currentSprint || "Sprint Inconnu";

                if (sortedSprints.length > 1) {
                    selectorContainer.classList.remove('hidden');
                    select.innerHTML = sortedSprints.map(s => `<option value="${s}" ${s === currentSprint ? 'selected' : ''}>${s}</option>`).join('');
                }
                refreshTable();
            });

            select.addEventListener('change', (e) => {
                currentSprint = e.target.value;
                sprintDisplay.innerText = currentSprint;
                refreshTable();
            });
        }

        function refreshTable() {
            const tbody = document.getElementById('votes-body');
            const noVotes = document.getElementById('no-votes');
            const tableWrapper = document.getElementById('table-wrapper');
            const filtered = allData.filter(v => v.sprint === currentSprint).sort((a,b) => b.count - a.count);
            
            if (filtered.length === 0) {
                noVotes.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
            } else {
                noVotes.classList.add('hidden');
                tableWrapper.classList.remove('hidden');
                tbody.innerHTML = filtered.map(i => {
                    const voted = hasVoted(i.ticket, currentSprint);
                    return `
                    <tr class="${voted ? 'bg-green-50/40' : 'hover:bg-slate-50'} transition-colors">
                        <td class="px-6 py-4 text-sm font-bold text-blue-600 font-mono break-words">${i.ticket}</td>
                        <td class="px-6 py-4 text-sm text-slate-600 leading-tight">${i.summary || 'N/A'}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="${voted ? '' : `castVote('${i.ticket}', '${(i.summary || "").replace(/'/g, "\\'")}')`}" 
                                    class="${voted ? 'voted-btn' : 'bg-blue-600 hover:bg-blue-700 active:scale-95'} text-white text-[9px] font-black px-3 py-2 rounded-lg transition-all shadow-md uppercase">
                                ${voted ? 'D&Eacute;J&Agrave; VOT&Eacute;' : `&Ccedil;A M'INT&Eacute;RESSE (${i.count})`}
                            </button>
                        </td>
                    </tr>`;
                }).join('');
            }
        }
        start();
    </script>
</body>
</html>
