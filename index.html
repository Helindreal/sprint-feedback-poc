<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Feedback - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-dots:after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
        /* Force la table à respecter les largeurs de colonnes fixées */
        .fixed-table { table-layout: fixed; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-900 font-sans flex justify-center">
    <div class="w-full max-w-4xl">
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden">
            
            <!-- Header Section (Masqué lors du vote) -->
            <header id="main-header" class="p-10 pb-6 text-center bg-white">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight mb-2">
                    Sprint <span class="text-blue-600">Feedback</span>
                </h1>
                <div class="space-y-1">
                    <p id="current-sprint-display" class="text-slate-500 font-bold italic">Chargement du sprint...</p>
                </div>
            </header>

            <main class="p-8 pt-0">
                <!-- Séparateur (Masqué lors du vote) -->
                <div id="main-separator" class="w-full h-px bg-slate-200 mb-8"></div>

                <!-- Vue Vote Success (Épurée) -->
                <div id="view-vote" class="hidden py-20 text-center animate-in fade-in slide-in-from-top-4 duration-700">
                    <div class="inline-flex items-center justify-center w-24 h-24 bg-green-50 text-green-500 rounded-full text-5xl mb-8 shadow-inner">✓</div>
                    
                    <h2 class="text-3xl font-black text-slate-800 mb-8">Intérêt enregistré !</h2>
                    
                    <div class="bg-slate-50 rounded-2xl p-8 mb-12 max-w-lg mx-auto border border-slate-100 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 tracking-tight mb-4 italic">Votre intérêt pour le ticket a été enregistré :</p>
                        <p id="vote-ticket-id" class="text-blue-600 font-mono font-bold text-lg mb-2"></p>
                        <p id="vote-ticket-summary" class="text-slate-700 font-medium italic leading-relaxed text-sm"></p>
                    </div>
                    
                    <button onclick="window.close();" class="px-12 py-5 bg-slate-900 text-white rounded-2xl text-xs font-black uppercase tracking-widest shadow-2xl hover:bg-slate-800 transition-all active:scale-95">
                        Fermer cet onglet
                    </button>
                </div>

                <!-- Vue Dashboard -->
                <div id="view-dashboard" class="hidden space-y-6">
                    <div class="flex items-center justify-between px-1">
                        <h2 class="text-lg font-bold text-slate-700 flex items-center gap-3">
                            <span class="text-xl">📊</span>
                            Sujets les plus attendus
                        </h2>
                        
                        <div id="sprint-selector-container" class="hidden">
                            <select id="sprint-select" class="bg-slate-50 border border-slate-200 text-[11px] font-bold rounded-lg px-3 py-1.5 text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                            </select>
                        </div>
                    </div>

                    <!-- Table avec colonnes figées -->
                    <div id="table-wrapper" class="hidden rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse fixed-table">
                            <thead class="bg-slate-100 border-b border-slate-200">
                                <tr>
                                    <th class="w-[20%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">Ticket</th>
                                    <th class="w-[65%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">Résumé</th>
                                    <th class="w-[15%] px-6 py-4 text-center text-[10px] font-black text-slate-500 uppercase tracking-widest">Votes</th>
                                </tr>
                            </thead>
                            <tbody id="votes-body" class="divide-y divide-slate-100 font-medium text-slate-700">
                            </tbody>
                        </table>
                    </div>

                    <div id="no-votes" class="hidden py-16 text-center">
                        <p class="text-slate-400 font-medium italic">Aucun vote pour le moment.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMJd9PI6mwwGvCmTAtqE53q7ZrHgt2VE",
            authDomain: "sprint-feedback.firebaseapp.com",
            projectId: "sprint-feedback",
            storageBucket: "sprint-feedback.firebasestorage.app",
            messagingSenderId: "637255677602",
            appId: "1:637255677602:web:b19f5c84f2226f9a8009fb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const ticketId = params.get('ticket');
        const summary = params.get('summary');
        const urlSprint = params.get('sprint');
        
        let currentSprint = urlSprint ? urlSprint.trim() : null;
        let allData = [];

        async function start() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        if (ticketId) handleVote();
                        else handleDashboard();
                    }
                });
            } catch (e) { console.error(e); }
        }

        async function handleVote() {
            // On masque l'entête global pour la vue de vote
            document.getElementById('main-header').classList.add('hidden');
            document.getElementById('main-separator').classList.add('hidden');
            document.getElementById('view-vote').classList.remove('hidden');
            
            // Mise à jour des informations de confirmation
            document.getElementById('vote-ticket-id').innerText = ticketId;
            document.getElementById('vote-ticket-summary').innerText = summary || "Sans résumé";

            const sprintForThisVote = urlSprint || "Sprint Inconnu";
            const voteRef = doc(db, "votes", ticketId);
            try {
                const snap = await getDoc(voteRef);
                if (snap.exists()) {
                    await updateDoc(voteRef, { count: increment(1), lastUpdated: new Date().toISOString() });
                } else {
                    await setDoc(voteRef, { ticket: ticketId, summary: summary || "N/A", sprint: sprintForThisVote, count: 1, lastUpdated: new Date().toISOString() });
                }
            } catch (e) { console.error(e); }
        }

        function handleDashboard() {
            document.getElementById('view-dashboard').classList.remove('hidden');
            const select = document.getElementById('sprint-select');
            const selectorContainer = document.getElementById('sprint-selector-container');
            const sprintDisplay = document.getElementById('current-sprint-display');

            onSnapshot(collection(db, "votes"), (snap) => {
                allData = [];
                const foundSprints = new Set();
                snap.forEach(d => {
                    const data = d.data();
                    allData.push(data);
                    if (data.sprint) foundSprints.add(data.sprint);
                });

                const sortedSprints = Array.from(foundSprints).sort().reverse();
                if (!currentSprint && sortedSprints.length > 0) currentSprint = sortedSprints[0];

                sprintDisplay.innerText = currentSprint || "Sprint Inconnu";

                if (sortedSprints.length > 1) {
                    selectorContainer.classList.remove('hidden');
                    select.innerHTML = sortedSprints.map(s => `<option value="${s}" ${s === currentSprint ? 'selected' : ''}>${s}</option>`).join('');
                }
                refreshTable();
            });

            select.addEventListener('change', (e) => {
                currentSprint = e.target.value;
                sprintDisplay.innerText = currentSprint;
                refreshTable();
            });
        }

        function refreshTable() {
            const tbody = document.getElementById('votes-body');
            const noVotes = document.getElementById('no-votes');
            const tableWrapper = document.getElementById('table-wrapper');
            const filtered = allData.filter(v => v.sprint === currentSprint).sort((a,b) => b.count - a.count);
            
            if (filtered.length === 0) {
                noVotes.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
            } else {
                noVotes.classList.add('hidden');
                tableWrapper.classList.remove('hidden');
                tbody.innerHTML = filtered.map(i => `
                    <tr class="hover:bg-slate-50 transition-colors">
                        <td class="px-6 py-5 text-sm font-bold text-blue-600 font-mono break-words" title="${i.ticket}">${i.ticket}</td>
                        <td class="px-6 py-5 text-sm text-slate-600 truncate" title="${i.summary || 'N/A'}">${i.summary || 'N/A'}</td>
                        <td class="px-6 py-5 text-center font-bold text-slate-400">
                            ${i.count}
                        </td>
                    </tr>`).join('');
            }
        }
        start();
    </script>
</body>
</html>
