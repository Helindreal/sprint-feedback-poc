<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Feedback - Dashboard Dynamique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .glass-effect { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .tab-transition { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-900 font-sans">
    <div class="max-w-4xl mx-auto">
        <div class="bg-white rounded-3xl shadow-2xl shadow-blue-100/50 border border-slate-200 overflow-hidden tab-transition">
            
            <header class="p-8 border-b border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-6 bg-gradient-to-r from-white to-slate-50">
                <div class="space-y-1">
                    <h1 class="text-3xl font-black text-slate-800 tracking-tight">
                        Sprint <span class="text-blue-600 italic">Feedback</span>
                    </h1>
                    <div class="flex items-center gap-2">
                        <span id="status-dot" class="w-2 h-2 rounded-full bg-slate-300 animate-pulse"></span>
                        <p id="status" class="text-[10px] font-bold uppercase tracking-widest text-slate-400 font-mono">
                            Initialisation...
                        </p>
                    </div>
                </div>
                
                <div id="sprint-selector-container" class="hidden flex flex-col items-start md:items-end">
                    <label for="sprint-select" class="text-[10px] font-black uppercase text-slate-400 mb-1.5 tracking-tighter">Historique des Sprints</label>
                    <select id="sprint-select" class="bg-white border border-slate-200 text-sm font-bold rounded-xl px-4 py-2.5 text-slate-700 shadow-sm hover:border-blue-300 focus:outline-none focus:ring-4 focus:ring-blue-500/10 cursor-pointer transition-all">
                    </select>
                </div>
            </header>

            <main class="p-8">
                <div id="msg-vote" class="hidden py-12 text-center animate-in fade-in zoom-in duration-500">
                    <div class="inline-flex items-center justify-center w-24 h-24 bg-green-100 text-green-600 rounded-full text-5xl mb-8 shadow-inner">✓</div>
                    <h2 class="text-3xl font-extrabold text-slate-800 mb-4">Intérêt enregistré !</h2>
                    <p id="vote-detail" class="text-slate-500 max-w-sm mx-auto leading-relaxed font-medium"></p>
                    <div class="mt-12 inline-block px-8 py-4 bg-slate-900 text-white rounded-2xl text-sm font-bold shadow-lg shadow-slate-200">
                        Vous pouvez fermer cet onglet
                    </div>
                    <div class="mt-6">
                        <button onclick="window.location.href='?'" class="text-sm text-blue-600 font-bold hover:underline italic">Voir tous les résultats</button>
                    </div>
                </div>

                <div id="results" class="hidden space-y-6">
                    <div class="flex items-center justify-between">
                        <h2 class="text-xl font-bold text-slate-700 flex items-center gap-3">
                            <span class="flex items-center justify-center w-8 h-8 bg-blue-600 text-white rounded-lg text-sm shadow-md shadow-blue-200">📊</span>
                            Attentes pour la démonstration
                        </h2>
                        <span id="vote-count-total" class="text-[10px] font-black bg-slate-100 px-3 py-1.5 rounded-lg text-slate-500 uppercase tracking-widest border border-slate-200">
                            Chargement...
                        </span>
                    </div>

                    <div id="table-wrapper" class="hidden rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50/50 border-b border-slate-100 text-xs font-black text-slate-400 uppercase tracking-wider">
                                <tr>
                                    <th class="px-6 py-4">Ticket</th>
                                    <th class="px-6 py-4">Résumé</th>
                                    <th class="px-6 py-4 text-center">Votes</th>
                                </tr>
                            </thead>
                            <tbody id="votes-body" class="divide-y divide-slate-50"></tbody>
                        </table>
                    </div>

                    <div id="no-votes" class="hidden py-24 text-center">
                        <div class="text-5xl mb-4 opacity-20 italic">🔍</div>
                        <p class="text-slate-400 font-medium italic">Aucun vote pour ce sprint.</p>
                    </div>
                </div>

                <div id="error-box" class="hidden mt-4 p-6 bg-red-50 border border-red-100 rounded-2xl shadow-inner">
                    <div class="flex items-start gap-4 text-red-800">
                        <span class="text-2xl">📡</span>
                        <div>
                            <p class="font-bold text-sm italic">Erreur de communication Cloud</p>
                            <p id="error-msg" class="text-xs mt-1.5 leading-relaxed font-medium"></p>
                            <button onclick="window.location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white text-[10px] font-black uppercase tracking-widest rounded-lg">Réessayer</button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMJd9PI6mwwGvCmTAtqE53q7ZrHgt2VE",
            authDomain: "sprint-feedback.firebaseapp.com",
            projectId: "sprint-feedback",
            storageBucket: "sprint-feedback.firebasestorage.app",
            messagingSenderId: "637255677602",
            appId: "1:637255677602:web:b19f5c84f2226f9a8009fb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        const ticketId = params.get('ticket');
        const summary = params.get('summary');
        const urlSprint = params.get('sprint');
        
        let currentSprint = urlSprint ? urlSprint.trim() : null;
        let allData = [];

        async function start() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        const statusEl = document.getElementById('status');
                        const dot = document.getElementById('status-dot');
                        statusEl.innerText = "Cloud : Connecté";
                        statusEl.classList.replace('text-slate-400', 'text-green-500');
                        dot.classList.replace('bg-slate-300', 'bg-green-500');
                        dot.classList.remove('animate-pulse');

                        if (ticketId) handleVote();
                        else handleDashboard();
                    }
                });
            } catch (e) {
                console.error(e);
                document.getElementById('error-box').classList.remove('hidden');
                document.getElementById('error-msg').innerText = e.message;
            }
        }

        async function handleVote() {
            document.getElementById('msg-vote').classList.remove('hidden');
            const sprintForThisVote = urlSprint || "Sprint Actuel";
            const voteRef = doc(db, "votes", ticketId);
            
            try {
                const snap = await getDoc(voteRef);
                if (snap.exists()) {
                    await updateDoc(voteRef, { count: increment(1), lastUpdated: new Date().toISOString() });
                } else {
                    await setDoc(voteRef, { ticket: ticketId, summary: summary || "N/A", sprint: sprintForThisVote, count: 1, lastUpdated: new Date().toISOString() });
                }
                document.getElementById('vote-detail').innerHTML = `Intérêt noté pour <b>${ticketId}</b> (${sprintForThisVote}).`;
            } catch (e) { console.error(e); }
        }

        function handleDashboard() {
            document.getElementById('results').classList.remove('hidden');
            const select = document.getElementById('sprint-select');
            const selectorContainer = document.getElementById('sprint-selector-container');

            onSnapshot(collection(db, "votes"), (snap) => {
                allData = [];
                const foundSprints = new Set();
                snap.forEach(d => {
                    const data = d.data();
                    allData.push(data);
                    if (data.sprint) foundSprints.add(data.sprint);
                });

                const sortedSprints = Array.from(foundSprints).sort().reverse();
                if (!currentSprint && sortedSprints.length > 0) currentSprint = sortedSprints[0];

                if (sortedSprints.length >= 1) {
                    selectorContainer.classList.remove('hidden');
                    select.innerHTML = sortedSprints.map(s => `<option value="${s}" ${s === currentSprint ? 'selected' : ''}>${s}</option>`).join('');
                }
                refreshTable();
            });

            select.addEventListener('change', (e) => {
                currentSprint = e.target.value;
                refreshTable();
            });
        }

        function refreshTable() {
            const tbody = document.getElementById('votes-body');
            const noVotes = document.getElementById('no-votes');
            const tableWrapper = document.getElementById('table-wrapper');
            const filtered = allData.filter(v => v.sprint === currentSprint).sort((a,b) => b.count - a.count);
            
            const totalVotes = filtered.reduce((acc, curr) => acc + (curr.count || 0), 0);
            document.getElementById('vote-count-total').innerText = `${totalVotes} Vote${totalVotes > 1 ? 's' : ''}`;

            if (filtered.length === 0) {
                noVotes.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
            } else {
                noVotes.classList.add('hidden');
                tableWrapper.classList.remove('hidden');
                tbody.innerHTML = filtered.map(i => `
                    <tr class="hover:bg-blue-50/40 transition-colors">
                        <td class="px-6 py-5 text-sm font-bold text-blue-600 font-mono">${i.ticket}</td>
                        <td class="px-6 py-5 text-sm text-slate-600 font-medium">${i.summary || 'N/A'}</td>
                        <td class="px-6 py-5 text-center">
                            <span class="inline-flex items-center justify-center bg-blue-600 text-white font-black text-xs px-2 h-7 min-w-[28px] rounded-full shadow-sm">${i.count}</span>
                        </td>
                    </tr>`).join('');
            }
        }

        start();
    </script>
</body>
</html>
