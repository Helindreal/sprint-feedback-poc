<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Feedback - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-dots:after { content: '...'; animation: dots 1.5s steps(5, end) infinite; }
        @keyframes dots { 0%, 20% { content: ''; } 40% { content: '.'; } 60% { content: '..'; } 80%, 100% { content: '...'; } }
        .fixed-table { table-layout: fixed; }
        .voted-btn { background-color: #10b981 !important; color: white !important; cursor: default; }
        .toast-slide { animation: slideIn 0.5s ease-out; }
        @keyframes slideIn { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .domain-header { background: linear-gradient(to right, #f8fafc, #ffffff); }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4 md:p-10 text-slate-900 font-sans flex justify-center">
    <div id="app-container" class="w-full max-w-4xl opacity-0 transition-opacity duration-500">
        <div class="bg-white rounded-xl shadow-xl border border-slate-100 overflow-hidden">
            
            <div id="vote-success-banner" class="hidden toast-slide bg-green-600 text-white p-4 text-center shadow-lg">
                <span class="font-bold uppercase tracking-widest text-xs italic">
                    ✓ Int&eacute;r&ecirc;t enregistr&eacute; pour <span id="voted-ticket-name"></span> !
                </span>
            </div>

            <header id="main-header" class="p-10 pb-6 text-center bg-white">
                <h1 class="text-4xl font-black text-slate-800 tracking-tight mb-2">
                    Sprint <span class="text-blue-600">Feedback</span>
                </h1>
                <div class="space-y-1">
                    <p id="current-sprint-display" class="text-slate-500 font-bold italic">Chargement du sprint...</p>
                </div>
                <div id="admin-badge" class="hidden mt-2 inline-block bg-amber-100 text-amber-700 text-[10px] font-black px-2 py-0.5 rounded uppercase tracking-widest border border-amber-200">Mode R&eacute;sultats</div>
            </header>

            <main class="p-8 pt-0">
                <div id="main-separator" class="w-full h-px bg-slate-200 mb-8"></div>

                <div id="view-dashboard" class="hidden space-y-6">
                    <div class="flex items-center justify-between px-1">
                        <h2 id="view-title" class="text-lg font-bold text-slate-700 flex items-center gap-3">
                            <span id="view-icon" class="text-xl">🗳️</span>
                            <span id="view-text">Exprimez votre int&eacute;r&ecirc;t</span>
                        </h2>
                        
                        <div id="sprint-selector-container" class="hidden">
                            <select id="sprint-select" class="bg-slate-50 border border-slate-200 text-[11px] font-bold rounded-lg px-3 py-1.5 text-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500/20">
                            </select>
                        </div>
                    </div>

                    <div id="table-wrapper" class="hidden rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                        <table class="w-full text-left border-collapse fixed-table">
                            <thead class="bg-slate-100 border-b border-slate-200">
                                <tr>
                                    <th class="w-[25%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">Ticket</th>
                                    <th class="w-[55%] px-6 py-4 text-[10px] font-black text-slate-500 uppercase tracking-widest">R&eacute;sum&eacute;</th>
                                    <th id="th-action" class="w-[20%] px-6 py-4 text-center text-[10px] font-black text-slate-500 uppercase tracking-widest">Action</th>
                                </tr>
                            </thead>
                            <tbody id="votes-body" class="divide-y divide-slate-100 text-slate-700">
                            </tbody>
                        </table>
                    </div>

                    <div id="no-votes" class="hidden py-16 text-center">
                        <p class="text-slate-400 font-medium italic">Aucun sujet trouv&eacute;.</p>
                    </div>
                </div>
            </main>
        </div>
        
        <!-- Footer discret avec lien "caché" pour l'équipe -->
        <footer class="mt-6 text-center">
            <button id="admin-trigger" class="text-[9px] text-slate-300 hover:text-slate-400 transition-colors uppercase tracking-[0.2em] font-medium">
                &bull; Acc&egrave;s &Eacute;quipe &bull;
            </button>
        </footer>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, increment, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWMJd9PI6mwwGvCmTAtqE53q7ZrHgt2VE",
            authDomain: "sprint-feedback.firebaseapp.com",
            projectId: "sprint-feedback",
            storageBucket: "sprint-feedback.firebasestorage.app",
            messagingSenderId: "637255677602",
            appId: "1:637255677602:web:b19f5c84f2226f9a8009fb"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const params = new URLSearchParams(window.location.search);
        
        // --- SÉCURITÉ VUE RÉSULTATS ---
        const ADMIN_PASSWORD = "admin123"; 
        let isAdmin = false;

        function checkAdminAccess(silent = false) {
            if (params.get('view') === 'results') {
                const entry = silent ? ADMIN_PASSWORD : prompt("Accès restreint. Veuillez saisir le mot de passe équipe :");
                if (entry === ADMIN_PASSWORD) {
                    isAdmin = true;
                    return true;
                } else {
                    if (!silent) alert("Mot de passe incorrect.");
                    window.location.href = window.location.pathname + window.location.search.replace('view=results', '').replace('&&','&').replace('?&','?');
                    return false;
                }
            }
            return false;
        }

        // Vérification initiale (sans prompt si l'URL n'a pas le paramètre)
        if (params.get('view') === 'results') {
            checkAdminAccess();
        }

        const ticketIdFromUrl = params.get('ticket');
        const summaryFromUrl = params.get('summary');
        const urlSprint = params.get('sprint');
        
        let currentSprint = urlSprint ? urlSprint.trim() : null;
        let allData = [];
        let autoVoted = false;

        const getVotedTickets = () => JSON.parse(localStorage.getItem('sprint_votes_v3') || '{}');
        const markAsVoted = (tid, spr) => { 
            const v = getVotedTickets(); 
            v[`${tid}||${spr}`] = true; 
            localStorage.setItem('sprint_votes_v3', JSON.stringify(v)); 
        };
        const hasVoted = (tid, spr) => !!getVotedTickets()[`${tid}||${spr}`];
        
        const extractDomain = (summary) => {
            const match = summary.match(/^\[(.*?)\]/);
            return match ? match[1] : "Autres Domaines";
        };

        async function handleSync() {
            const initData = params.get('init');
            if (!initData || !currentSprint) return;
            const tickets = initData.split('|');
            for (const item of tickets) {
                const [tid, ...summParts] = item.split(':');
                const summ = summParts.join(':');
                const ref = doc(db, "votes", tid);
                const snap = await getDoc(ref);
                if (!snap.exists()) {
                    await setDoc(ref, { 
                        ticket: tid, summary: summ, sprint: currentSprint, count: 0, lastUpdated: new Date().toISOString() 
                    });
                }
            }
        }

        async function start() {
            try {
                await signInAnonymously(auth);
                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        await handleSync();
                        setupUI();
                        if (ticketIdFromUrl && !autoVoted && !hasVoted(ticketIdFromUrl, currentSprint)) {
                            autoVoted = true;
                            await castVote(ticketIdFromUrl, summaryFromUrl);
                        } else if (ticketIdFromUrl) {
                            showSuccess(ticketIdFromUrl);
                        }
                        handleDashboard();
                        document.getElementById('app-container').classList.remove('opacity-0');
                    }
                });
            } catch (e) { console.error(e); }
        }

        function setupUI() {
            const trigger = document.getElementById('admin-trigger');
            if (isAdmin) {
                document.getElementById('admin-badge').classList.remove('hidden');
                document.getElementById('view-icon').innerText = "📈";
                document.getElementById('view-text').innerText = "Sujets les plus attendus";
                document.getElementById('th-action').innerText = "Votes";
                // En mode admin, le bouton de pied de page permet de revenir au mode vote
                trigger.innerText = "↩ Revenir au mode vote";
                trigger.onclick = () => {
                    window.location.href = window.location.pathname + window.location.search.replace('view=results', '').replace('&&','&').replace('?&','?');
                };
            } else {
                // En mode vote, le bouton discret demande le mot de passe pour passer en admin
                trigger.onclick = () => {
                    const entry = prompt("Saisir le mot de passe équipe :");
                    if (entry === ADMIN_PASSWORD) {
                        const separator = window.location.search ? '&' : '?';
                        window.location.href = window.location.href + separator + "view=results";
                    } else if (entry !== null) {
                        alert("Accès refusé.");
                    }
                };
            }
        }

        window.castVote = async (tid, summ) => {
            if (isAdmin) return;
            const sprintName = currentSprint || urlSprint || "Sprint Inconnu";
            if (hasVoted(tid, sprintName)) return;

            const voteRef = doc(db, "votes", tid);
            try {
                const snap = await getDoc(voteRef);
                if (snap.exists()) {
                    await updateDoc(voteRef, { count: increment(1), lastUpdated: new Date().toISOString() });
                } else {
                    await setDoc(voteRef, { ticket: tid, summary: summ || "N/A", sprint: sprintName, count: 1, lastUpdated: new Date().toISOString() });
                }
                markAsVoted(tid, sprintName);
                showSuccess(tid);
                refreshTable();
            } catch (e) { console.error(e); }
        }

        function showSuccess(tid) {
            const banner = document.getElementById('vote-success-banner');
            const nameEl = document.getElementById('voted-ticket-name');
            if (nameEl) nameEl.innerText = tid;
            banner.classList.remove('hidden');
            setTimeout(() => banner.classList.add('hidden'), 5000);
        }

        function handleDashboard() {
            document.getElementById('view-dashboard').classList.remove('hidden');
            const select = document.getElementById('sprint-select');
            const selectorContainer = document.getElementById('sprint-selector-container');
            const sprintDisplay = document.getElementById('current-sprint-display');

            onSnapshot(collection(db, "votes"), (snap) => {
                allData = [];
                const foundSprints = new Set();
                snap.forEach(d => {
                    const data = d.data();
                    allData.push(data);
                    if (data.sprint) foundSprints.add(data.sprint);
                });

                const sortedSprints = Array.from(foundSprints).sort().reverse();
                if (!currentSprint && sortedSprints.length > 0) currentSprint = sortedSprints[0];
                sprintDisplay.innerText = currentSprint || "Sprint Inconnu";

                if (sortedSprints.length > 1) {
                    selectorContainer.classList.remove('hidden');
                    select.innerHTML = sortedSprints.map(s => `<option value="${s}" ${s === currentSprint ? 'selected' : ''}>${s}</option>`).join('');
                }
                refreshTable();
            }, (err) => console.error("Snapshot error:", err));

            select.addEventListener('change', (e) => {
                currentSprint = e.target.value;
                sprintDisplay.innerText = currentSprint;
                refreshTable();
            });
        }

        function refreshTable() {
            const tbody = document.getElementById('votes-body');
            const noVotes = document.getElementById('no-votes');
            const tableWrapper = document.getElementById('table-wrapper');
            let filtered = allData.filter(v => v.sprint === currentSprint);
            
            if (filtered.length === 0) {
                noVotes.classList.remove('hidden');
                tableWrapper.classList.add('hidden');
                return;
            }

            noVotes.classList.add('hidden');
            tableWrapper.classList.remove('hidden');

            let html = "";
            if (isAdmin) {
                filtered.sort((a,b) => b.count - a.count);
                html = filtered.map(renderRow).join('');
            } else {
                const grouped = {};
                filtered.forEach(item => {
                    const domain = extractDomain(item.summary || "");
                    if (!grouped[domain]) grouped[domain] = [];
                    grouped[domain].push(item);
                });

                const sortedDomains = Object.keys(grouped).sort((a, b) => {
                    if (a === "Autres Domaines") return 1;
                    if (b === "Autres Domaines") return -1;
                    return a.localeCompare(b);
                });

                sortedDomains.forEach(domain => {
                    html += `<tr class="domain-header"><td colspan="3" class="px-6 py-2 text-[10px] font-black text-slate-400 uppercase tracking-widest bg-slate-50/70 border-y border-slate-100">${domain}</td></tr>`;
                    html += grouped[domain].sort((a,b) => a.ticket.localeCompare(b.ticket, undefined, { numeric: true })).map(renderRow).join('');
                });
            }
            tbody.innerHTML = html;
        }

        function renderRow(i) {
            const voted = hasVoted(i.ticket, currentSprint);
            const actionContent = isAdmin 
                ? `<span class="inline-block bg-blue-50 text-blue-700 font-black px-4 py-1.5 rounded-full text-[10px] tracking-tight border border-blue-100">${i.count} vote${i.count > 1 ? 's' : ''}</span>`
                : `<button onclick="${voted ? '' : `castVote('${i.ticket}', '${(i.summary || "").replace(/'/g, "\\'")}')`}" 
                        class="${voted ? 'voted-btn' : 'bg-blue-600 hover:bg-blue-700 active:scale-95 shadow-sm'} text-white text-[9px] font-black px-3 py-2 rounded-lg transition-all uppercase tracking-tighter">
                    ${voted ? 'D&Eacute;J&Agrave; VOT&Eacute;' : 'INT&Eacute;RESS&Eacute;'}
                   </button>`;

            return `
            <tr class="${voted && !isAdmin ? 'bg-green-50/20' : 'hover:bg-slate-50/50'} transition-colors">
                <td class="px-6 py-4 text-[11px] font-bold text-blue-600 font-mono tracking-tighter">${i.ticket}</td>
                <td class="px-6 py-4 text-xs text-slate-600 font-medium leading-tight">${i.summary || 'N/A'}</td>
                <td class="px-6 py-4 text-center">${actionContent}</td>
            </tr>`;
        }

        start();
    </script>
</body>
</html>
